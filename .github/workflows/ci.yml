name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          REACT_APP_API_BASE_URL: http://localhost:8000/api
          REACT_APP_SOCKET_URL: http://localhost:4000
          REACT_APP_STRIPE_PK: pk_test_ci_placeholder
          REACT_APP_PUBLIC_URL: http://localhost:3000
        run: npm run build

      # NOTE: pas de seuil `--audit-level=high` ici. Les 12 vulnerabilites
      # hautes restantes proviennent toutes de la chaine de build react-scripts
      # (CRA, non maintenu) et ne sont pas embarquees dans le bundle livre.
      # Le seuil sera reactive apres migration vers Vite.
      - name: Audit des dependances (informatif)
        run: npm audit --audit-level=high || true
